name: Decan Movie Windows Desktop Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Decan Movie Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show project structure
        shell: powershell
        run: |
          Write-Host "Repository:"
          Get-ChildItem

          Write-Host "Desktop:"
          Get-ChildItem desktop

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Validate desktop source
        working-directory: desktop
        run: npm run check

      - name: Build Windows installer, portable EXE and ZIP
        working-directory: desktop
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $release = "desktop/release"

          if (!(Test-Path $release)) {
            Write-Error "Release directory was not created."
            exit 1
          }

          $files = Get-ChildItem $release -File

          if ($files.Count -eq 0) {
            Write-Error "No Windows build files were generated."
            exit 1
          }

          $output = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $output | Out-File `
            -FilePath "$release/checksums-sha256.txt" `
            -Encoding utf8

      - name: List generated Windows files
        shell: powershell
        run: |
          Write-Host "Generated files:"
          Get-ChildItem desktop/release -File |
            Select-Object Name, Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Decan-Movie-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/checksums-sha256.txt
          if-no-files-found: error

      - name: Publish Windows files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/checksums-sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
