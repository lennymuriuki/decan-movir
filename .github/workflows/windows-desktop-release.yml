name: Decan Movie Windows Desktop Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Decan Movie Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate desktop source
        run: npm run check

      - name: Build Windows installer, portable and ZIP
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $files = Get-ChildItem -Path release -File

          $output = @()

          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $output += "$hash  $($file.Name)"
          }

          $output | Out-File `
            -FilePath release/checksums-sha256.txt `
            -Encoding utf8

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Decan-Movie-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/checksums-sha256.txt
          if-no-files-found: error

      - name: Upload Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
            desktop/release/checksums-sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
