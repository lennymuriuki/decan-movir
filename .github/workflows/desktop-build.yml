name: Build Decan Movie Desktop

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Work out version (MAJOR.MINOR.PATCH)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.0"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: gradle :desktop:packageDistributionForCurrentOS -PdesktopOnly=true -PappVersion="$APP_VERSION" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: decan-movie-desktop-${{ matrix.os }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/deb/*.deb
