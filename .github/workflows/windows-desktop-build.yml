name: Build Decan Movie Windows Desktop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Test & Package Windows x64 (.exe, .msi, Portable ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure WiX Toolset is available for EXE/MSI packaging
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
              Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            } elseif (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin") {
              Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WiX Toolset v3.14\bin"
            }
          }

      - name: Run Desktop Unit & UI Tests
        run: gradle :desktop:test --no-daemon -PtargetOs=windows

      - name: Build Windows Installers (.exe & .msi) and Portable ZIP
        run: >
          gradle :desktop:packageExe :desktop:packageMsi :desktop:packagePortableZip
          --no-daemon
          -PtargetOs=windows
          -PappVersionName="1.1.${{ github.run_number }}"

      - name: Collect Windows Build Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-artifacts | Out-Null
          Get-ChildItem -Path "desktop\build\compose\binaries\main\exe" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName "windows-artifacts\Decan-Movie-Setup.exe" -Force }
          Get-ChildItem -Path "desktop\build\compose\binaries\main\msi" -Filter "*.msi" -ErrorAction SilentlyContinue |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName "windows-artifacts\Decan-Movie-Setup.msi" -Force }
          if (Test-Path "desktop\build\distributions\Decan-Movie-Portable.zip") {
            Copy-Item "desktop\build\distributions\Decan-Movie-Portable.zip" "windows-artifacts\Decan-Movie-Portable.zip" -Force
          }
          Get-ChildItem windows-artifacts

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decan-movie-windows-desktop
          path: windows-artifacts/*
          retention-days: 30
